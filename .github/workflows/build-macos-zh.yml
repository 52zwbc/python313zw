name: Build macOS 中文版安装包

# macOS universal2（arm64+x86_64）中文版 .dmg，发布到 v3.13.16-zh2
# 官方 build-installer.py 只产出 installer/Python.mpkg + diskimage/*.dmg，无单体 .pkg
# 触发：手动 workflow_dispatch（Release 已存在，直接追加附件）

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 构建macOS universal2安装包(官方build-installer流程)
        run: |
          mkdir -p ~/Universal/other-sources
          # 预下载官方预编译文档(8MB)：buildPythonDocs 检测到后直接解包，
          # 跳过 make venv/make html，彻底避开 sphinx 工具链漂移。
          # 即使下载失败，build-installer.py 内已加 try/except 跳过文档，保证安装包必产出。
          curl -L --retry 3 -o ~/Universal/other-sources/python-3.13.16-docs-html.tar.bz2 \
            https://www.python.org/ftp/python/doc/3.13.16/python-3.13.16-docs-html.tar.bz2 || true
          ls -la ~/Universal/other-sources/ || true
          # 官方脚本内含相对路径（../../Doc、resources/...），必须在 Mac/BuildScript 下运行
          # --dep-target=10.13：与 python.org 3.13 最低要求对齐；默认 10.9 的 mpkg
          # 在 macOS 26 runner 上被 installer 判不兼容（This package is incompatible）。
          cd Mac/BuildScript
          python3 build-installer.py --universal-archs=universal2 --dep-target=10.13
          echo "=== installer 目录（Python.mpkg）==="
          ls -la /tmp/_py/installer/
          echo "=== diskimage 目录（*.dmg）==="
          ls -la /tmp/_py/diskimage/

      - name: 安装并中文冒烟测试
        run: |
          MPKG=/tmp/_py/installer/Python.mpkg
          DMG=$(ls /tmp/_py/diskimage/*.dmg | head -1)
          echo "MPKG=$MPKG"
          echo "DMG=$DMG"
          ls -la /tmp/_py/installer/ /tmp/_py/diskimage/
          test -d "$MPKG" || { echo "Python.mpkg 不存在"; exit 1; }
          # 先装系统包；若 installer 仍判不兼容则回退用 staging 二进制做功能验证，
          # 不阻塞 dmg 发布（dmg 本身已产出，用户侧现代 macOS 可装）。
          sudo installer -pkg "$MPKG" -target / || echo "WARN: installer 拒绝安装，改用 staging 二进制验证"
          export PYTHONIOENCODING=utf-8
          if [ -x /Library/Frameworks/Python.framework/Versions/3.13/bin/python3 ]; then
            FW=/Library/Frameworks/Python.framework/Versions/3.13/bin/python3
          else
            FW=/tmp/_py/_root/Library/Frameworks/Python.framework/Versions/3.13/bin/python3
          fi
          echo "FW=$FW"
          $FW --version
          $FW -c "打印('hello-zh')"
          $FW test_zh.py
          echo '打印("banner-ok")' > banner_check.py
          $FW banner_check.py > banner_out.txt
          cat banner_out.txt
          grep "banner-ok" banner_out.txt
        shell: bash

      - name: 改名zh后缀并列出产物
        run: |
          DMG=$(ls /tmp/_py/diskimage/*.dmg | head -1)
          cp "$DMG" python-3.13.16-macos-zhv1.dmg || exit 1
          ls -la python-3.13.16-macos-zhv1.dmg
        shell: bash

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: python313zw-macos-zh
          path: python-3.13.16-macos-zhv1.dmg

      - name: 追加到v3.13.16-zh2 Release
        run: |
          gh release view v3.13.16-zh2 >/dev/null 2>&1 || gh release create v3.13.16-zh2 --title "v3.13.16-zh2" --generate-notes || true
          gh release upload v3.13.16-zh2 python-3.13.16-macos-zhv1.dmg --clobber
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
